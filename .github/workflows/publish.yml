name: Build release APK

on:
  push:
    branches: [ master ]
  
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Setup JDK 21
        uses: actions/setup-java@v4.6.0
        with:
          java-version: 21
          distribution: 'temurin'
          cache: gradle
      - name: Provide Firebase config
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: echo $FIREBASE_CONFIG > ./AndroidApp/app/google-services.json
      - name: Compute version from commit count
        run: echo "VERSION_CODE=$(git rev-list --count HEAD)" >> $GITHUB_ENV
      - name: Build release APK
        working-directory: AndroidApp
        run: bash ./gradlew bundleRelease -PversionCode=$VERSION_CODE
      - name: Sign release APK
        id: sign-release
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: AndroidApp/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
      - name: Archive APK
        uses: actions/upload-artifact@v4.6.0
        with:
          name: app-release
          path: ${{ steps.sign-release.outputs.signedReleaseFile }}
